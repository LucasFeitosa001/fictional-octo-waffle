services:
  postgres:
    image: postgres:16-alpine
    container_name: beautypass-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: beautypass
      POSTGRES_USER: beautypass
      POSTGRES_PASSWORD: beautypass
    ports:
      - "5434:5432"
    volumes:
      - beautypass_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beautypass -d beautypass"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis backs BullMQ (message automations: reminders, follow-ups, campaigns).
  # Host port 6381 to avoid clashing with other local projects (6379/6399 taken).
  # AOF persistence so delayed/repeatable jobs survive a container restart.
  redis:
    image: redis:7-alpine
    container_name: beautypass-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6381:6379"
    volumes:
      - beautypass_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  beautypass_pgdata:
  beautypass_redisdata:
