services:
  postgres:
    image: postgres:16-alpine
    container_name: beautypass-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: beautypass
      POSTGRES_USER: beautypass
      POSTGRES_PASSWORD: beautypass
    ports:
      - "5432:5432"
    volumes:
      - beautypass_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beautypass -d beautypass"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  beautypass_pgdata:
