<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- color-scheme: o app é só light. Sem isso, o Chrome Android IGNORA o
         theme-color quando o celular está em dark mode (bug Chromium #980790),
         então a barra do navegador não adota a cor da marca. Forçando light,
         o theme-color é sempre respeitado. -->
    <meta name="color-scheme" content="light" />

    <!-- theme-color: cor da barra de navegação/status dos browsers mobile.
         Valor inicial = salonpass primary (gold); applyTheme() (theme.ts)
         SUBSTITUI este elemento em runtime pra bater com o tema atual (gold ↔
         índigo). Só UM theme-color no documento — múltiplos confundem o browser. -->
    <meta name="theme-color" content="#f2b33d" />

    <!-- Ícones -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- PWA / standalone (iOS + padrão). O manifest é injetado pelo
         vite-plugin-pwa (manifest.webmanifest) — NÃO linkamos manifest.json
         estático aqui (gerava dois <link rel=manifest> conflitantes). -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Salonpass" />
    <meta name="application-name" content="Salonpass" />

    <title>Salonpass Gestão</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Splash overlay: lives OUTSIDE #root so React.createRoot().render() cannot
         yank it on hydration. Stays covering the screen until App.tsx explicitly
         fades it (data-app-ready="1" on <html>) after the first session query
         resolves. This eliminates the "flash cascade" (splash black → cream
         FullScreenSpinner → page LoadingState → dashboard) on hard reload. -->
    <div id="splash">
      <img src="/brand/salonpass-wordmark-white.svg" alt="Salonpass" width="160" height="40" />
      <div class="splash__spinner" aria-hidden="true"></div>
    </div>
    <style>
      #splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #111111;
        z-index: 9999;
        opacity: 1;
        transition: opacity 220ms ease;
      }
      #splash > img { margin-bottom: 24px; }
      .splash__spinner {
        width: 32px;
        height: 32px;
        border: 3px solid rgba(242, 179, 61, 0.25);
        border-top-color: #f2b33d;
        border-radius: 50%;
        animation: sp-spin 0.7s linear infinite;
      }
      @keyframes sp-spin { to { transform: rotate(360deg); } }
      html[data-app-ready="1"] #splash {
        opacity: 0;
        pointer-events: none;
      }
    </style>
    <script>
      // bfcache guard (iOS Safari): quando a página volta do back-forward cache
      // (usuário sai pra outro app e retorna via app switcher), e.persisted=true.
      // Nesse caso NADA precisa ser feito — o DOM/JS já está pronto. Retornar
      // cedo evita qualquer efeito colateral que pudesse disparar um reload
      // ou re-hidratação desnecessária do React.
      window.addEventListener('pageshow', function(e) {
        if (e.persisted) return;
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
