<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- color-scheme: o app é só light. Sem isso, o Chrome Android IGNORA o
         theme-color quando o celular está em dark mode (bug Chromium #980790),
         então a barra do navegador não adota a cor da marca. Forçando light,
         o theme-color é sempre respeitado. -->
    <meta name="color-scheme" content="light" />

    <!-- theme-color: cor da barra de navegação/status dos browsers mobile.
         Valor inicial = salonpass primary (gold); applyTheme() (theme.ts)
         SUBSTITUI este elemento em runtime pra bater com o tema atual (gold ↔
         índigo). Só UM theme-color no documento — múltiplos confundem o browser. -->
    <meta name="theme-color" content="#f2b33d" />

    <!-- Ícones -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- PWA / standalone (iOS + padrão). O manifest é injetado pelo
         vite-plugin-pwa (manifest.webmanifest) — NÃO linkamos manifest.json
         estático aqui (gerava dois <link rel=manifest> conflitantes). -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- status-bar-style (SÓ vale em standalone / "Adicionar à Tela de Início"):
         - "default"/"black": o conteúdo é renderizado ABAIXO da status bar (o
           iOS reserva a barra; safe-area-inset-top continua exposta p/ o notch/
           Dynamic Island, mas a barra em si NÃO sobrepõe o conteúdo).
         - "black-translucent": o conteúdo preenche a tela INTEIRA, ficando SOB
           a status bar (obrigaria a pintar essa faixa e depender 100% da
           safe-area). Ref.: Apple SafariHTMLRef (MetaTags).
         Ficamos em "default": a status bar fica opaca (não engole o conteúdo) e
         o app só precisa reservar env(safe-area-inset-top) para o notch. Com
         viewport-fit=cover, essa reserva é responsabilidade do CSS (feita na
         casca mobile: .mobile-page-content / .mobile-topbar / MobileBackHeader). -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Salonpass Pro" />
    <meta name="application-name" content="Salonpass Pro" />

    <title>Salonpass Pro</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Splash overlay: lives OUTSIDE #root so React.createRoot().render() cannot
         yank it on hydration. Stays covering the screen until App.tsx explicitly
         fades it (data-app-ready="1" on <html>) after the first session query
         resolves. This eliminates the "flash cascade" (splash black → cream
         FullScreenSpinner → page LoadingState → dashboard) on hard reload. -->
    <div id="splash">
      <img src="/brand/salonpass-wordmark.svg" alt="Salonpass" width="168" height="42" />
      <div class="splash__dots" aria-hidden="true"><span></span><span></span><span></span></div>
    </div>
    <style>
      #splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #ffffff;
        z-index: 9999;
        opacity: 1;
        transition: opacity 260ms ease;
      }
      /* Logo "respira": fade + leve escala, em loop suave. */
      #splash > img {
        margin-bottom: 28px;
        animation: sp-breathe 1.8s ease-in-out infinite;
      }
      @keyframes sp-breathe {
        0%, 100% { opacity: 0.82; transform: scale(0.985); }
        50%      { opacity: 1;    transform: scale(1.02); }
      }
      /* Três bolinhas trocando (bounce em sequência) na cor primária. */
      .splash__dots { display: flex; gap: 8px; }
      .splash__dots > span {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: #545af5;
        animation: sp-bounce 1s ease-in-out infinite;
      }
      .splash__dots > span:nth-child(2) { animation-delay: 0.16s; }
      .splash__dots > span:nth-child(3) { animation-delay: 0.32s; }
      @keyframes sp-bounce {
        0%, 80%, 100% { transform: translateY(0);    opacity: 0.35; }
        40%           { transform: translateY(-9px); opacity: 1; }
      }
      html[data-app-ready="1"] #splash {
        opacity: 0;
        pointer-events: none;
      }
    </style>
    <script>
      // bfcache guard (iOS Safari): quando a página volta do back-forward cache
      // (usuário sai pra outro app e retorna via app switcher), e.persisted=true.
      // Nesse caso NADA precisa ser feito — o DOM/JS já está pronto. Retornar
      // cedo evita qualquer efeito colateral que pudesse disparar um reload
      // ou re-hidratação desnecessária do React.
      window.addEventListener('pageshow', function(e) {
        if (e.persisted) return;
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
